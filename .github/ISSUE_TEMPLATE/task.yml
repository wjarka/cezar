name: Task
description: File work with context, the change, and acceptance criteria
title: "[Task]: "
body:
  - type: textarea
    id: context
    attributes:
      label: Context / Why
      description: Why does this work need to happen?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
      description: The concrete change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system this issue touches.
      options:
        - area-cezar
        - area-web
        - area-contract
        - area-api-client
        - area-ci
        - area-docs
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Checklist of what "done" looks like. One verifiable outcome per line.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: related-links
    attributes:
      label: Related links
      description: Links to specs, other issues, or docs (optional)
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue explicitly does not cover (optional)
    validations:
      required: false
